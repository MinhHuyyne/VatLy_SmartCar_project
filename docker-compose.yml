# Chạy broker + backend trên laptop:  docker compose up --build
# Mở http://localhost:8000  (điện thoại: http://<IP-laptop>:8000)
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build:
      context: ./web
      dockerfile: backend/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SMARTCAR_ID: car01
    ports: ["8000:8000"]
    depends_on: [mosquitto]
    restart: unless-stopped

